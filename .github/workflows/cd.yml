name: cd

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

env:
  NODE_VERSION: 24.14.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type')"
          if [ "$TYPE" = "tag" ]; then
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA}" --jq '.object.sha')"
          fi
          COUNT="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&status=completed&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [ "$COUNT" -lt 1 ]; then
            echo "No successful CI push run found for $SHA"
            exit 1
          fi

  build:
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
            bundles: nsis
          - id: linux-x64
            os: ubuntu-22.04
            bundles: deb,appimage
          - id: macos-x64
            os: macos-15-intel
            bundles: dmg
          - id: macos-arm64
            os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build JavaScript workspaces
        run: npx turbo build

      - name: Build Rust API
        working-directory: api
        run: cargo build --release

      - name: Stage complete release
        run: python scripts/stage-tauri-release.py

      - name: Build signed Tauri packages
        working-directory: launcher
        run: npx tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      - name: Collect release packages
        shell: bash
        run: |
          mkdir -p release-output
          find launcher/src-tauri/target/release/bundle -type f \( -name '*.sig' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.nsis.zip' \) -exec cp {} release-output/ \;
          if ! find release-output -name '*.sig' -print -quit | grep -q .; then
            echo 'No signed updater artifacts were produced'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: release-output/*
          if-no-files-found: error

  build-headless:
    runs-on: ubuntu-22.04
    needs: verify-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build JavaScript workspaces
        run: npx turbo build

      - name: Build Rust API
        working-directory: api
        run: cargo build --release

      - name: Build headless Debian package
        run: python scripts/build-headless-deb.py

      - uses: actions/upload-artifact@v4
        with:
          name: headless-linux-x64
          path: release-output/mdev-server-linux-amd64.deb
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build
      - build-headless
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate signed updater manifest
        run: python scripts/publish-tauri-manifest.py

      - name: Include headless package
        run: cp release-artifacts/headless-linux-x64/mdev-server-linux-amd64.deb release-publish/

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-publish/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Attest release files
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-publish/*
